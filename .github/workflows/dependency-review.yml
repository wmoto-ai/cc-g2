name: Dependency Review

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/**"

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # No patched elliptic release exists. It is included by the browser crypto
          # polyfill, but cc-g2's Telegram path does not call ECDSA signing APIs.
          # Keep every other advisory blocking, including low severity findings.
          allow-ghsas: GHSA-848j-6mx2-7j84
