# Supply chain hardening: version updates with cooldown.
# Security updates は別系統(account-level で有効済み)で cooldown の影響を受けない。
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
      semver-patch-days: 3
      semver-major-days: 30
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # 0.0.10+ の ShadowTimers は同一 timeout を二重発火させるため 0.0.9 に固定する。
      # SDK 更新は実機検証で修正を確認してから手動で行う。
      - dependency-name: "@evenrealities/even_hub_sdk"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
