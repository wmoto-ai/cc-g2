# Supply chain hardening: version updates with cooldown.
# Security updates は別系統(account-level で有効済み)で cooldown の影響を受けない。
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
      semver-patch-days: 3
      semver-major-days: 30
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # ShadowTimers のタイマー二重発火バグ（0.0.10 以降で再現）があるため、
      # SDK 更新は Dependabot に任せず実機検証を経て手動で行う（現在は ^0.0.16）
      - dependency-name: "@evenrealities/even_hub_sdk"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
